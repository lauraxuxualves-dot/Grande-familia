<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div
    id="painelLoginExercicio"
    class="containerLoginTreino"
>

    <img
        src="./familia.jpg"
        alt="foto da família"
        id="imagemFamiliaLogin"
        class="imagemLoginTreino"
    >

    <h2
        id="tituloContaUsuario"
        class="tituloLoginTreino"
    >
        Entrar na
        <span
            id="destaqueContaTexto"
            class="textoDestaqueLogin"
        >
            Conta
        </span>
    </h2>

    <input
        type="email"
        placeholder="Seu email"
        id="campoEmailUsuario"
        class="inputLoginTreino"
    >

    <br>

    <input
        type="password"
        placeholder="Sua senha"
        id="campoSenhaUsuario"
        class="inputLoginTreino"
    >

    <br>

    <button
        onclick="entrar()"
        id="botaoEntrarConta"
        class="botaoLoginTreino"
    >
        Entrar
    </button>

    <h4
        id="mensagemAvisoLogin"
        class="textoAvisoTreino"
    >
    </h4>

</div>
</body>
</html>
