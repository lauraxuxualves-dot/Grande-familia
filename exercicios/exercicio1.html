<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicios</title>
</head>
<body>
    <body>

    <div>

        <h2>
            Cadastro de Usuário
        </h2>

        <p>
            Preencha os dados abaixo para criar sua conta.
        </p>

        <span>
            Nome completo
        </span>

        <input
            type="text"
            placeholder="Digite seu nome"
        >

        <span>
            Email
        </span>

        <input
            type="email"
            placeholder="Digite seu email"
        >

        <span>
            Senha
        </span>

        <input
            type="password"
            placeholder="Digite sua senha"
        >

        <button>
            Criar Conta
        </button>

        <p>
            Já possui uma conta?
        </p>

        <button>
            Entrar
        </button>

    </div>

</body>
</body>
</html>
