<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explicação</title>
    <link rel="stylesheet" href="explicacao.css">
</head>
<!--
Atributos
tag = 10 pontos
class = 12 pontos
id = 14 pontos
dois = depende de qual usar
atribuição direta = 15 pontos
!important = sempre prevalece

-->

<body>
    

    <div class="tudo">
    <h2 

    id="um" class="um" >nivel 1</h2>
    <h2 class="dois" >nivel 2</h2>
    <h2 class="tres" >nivel 3</h2>
    <h2 class="quatro" >nivel 4</h2>
    <h2 class="cinco" >nivel 5</h2>
    </div>
    <button onclick="cor()" >entrar</button>

<script>
    function cor(){
        document.querySelector("body")
.style.backgroundColor= "blue"    }
</script>
</body>
</html>
